# 英語の推敲で、対象のリポジトリに .vale.ini が無いときに使う。スタイルは vale sync で styles/ に取る。
# technical-writing が Google developer style に沿うので Google に揃える。版は URL で固定する。
StylesPath = styles
MinAlertLevel = warning
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip

[*.{md,mdx,txt,adoc}]
BasedOnStyles = Vale, Google, proselint
