#!/bin/bash
# gpg-agent.conf の必要な行だけを管理する。
# JetBrains IDE が同じファイルに pinentry-program を書き込むので、丸ごと置き換えない。
set -euo pipefail

CACHE_TTL_SECONDS=28800 # 8時間

current="$(cat)"
filtered="$(printf '%s\n' "$current" | grep -vE '^(default-cache-ttl|max-cache-ttl|default-cache-ttl-ssh|max-cache-ttl-ssh|enable-ssh-support|disable-scdaemon)( |$)' || true)"

[ -n "$filtered" ] && printf '%s\n' "$filtered"
cat <<EOF
default-cache-ttl $CACHE_TTL_SECONDS
max-cache-ttl $CACHE_TTL_SECONDS
default-cache-ttl-ssh $CACHE_TTL_SECONDS
max-cache-ttl-ssh $CACHE_TTL_SECONDS
enable-ssh-support
disable-scdaemon
EOF
