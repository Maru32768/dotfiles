{{- /* chezmoi:modify-template */ -}}
{{- /* gpg-agent.conf の必要な行だけを管理する。JetBrains IDE が同じファイルに pinentry-program を書き込むので、丸ごと置き換えない。 */ -}}
{{- /* キャッシュは最後に使ってから 24 時間、入力してから最長 72 時間。WSL と Windows (Git の gpg) で同じにする */ -}}
{{- $ttl := 86400 -}}
{{- $max := 259200 -}}
{{- $lines := list (printf "default-cache-ttl %d" $ttl) (printf "max-cache-ttl %d" $max) (printf "default-cache-ttl-ssh %d" $ttl) (printf "max-cache-ttl-ssh %d" $max) -}}
{{- if ne .chezmoi.os "windows" -}}
{{-   $lines = concat $lines (list "enable-ssh-support" "disable-scdaemon") -}}
{{- end -}}
{{- $names := list -}}
{{- range $lines -}}
{{-   $names = append $names (regexReplaceAll " .*" . "") -}}
{{- end -}}
{{- $managed := printf "^(%s)( |$)" (join "|" $names) -}}
{{- $kept := list -}}
{{- range splitList "\n" .chezmoi.stdin -}}
{{-   $line := trimSuffix "\r" . -}}
{{-   if and $line (not (regexMatch $managed $line)) -}}
{{-     $kept = append $kept $line -}}
{{-   end -}}
{{- end -}}
{{ join "\n" (concat $kept $lines) }}
