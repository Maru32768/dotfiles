{{- /* chezmoi:modify-template */ -}}
{{- /* Codex 自身も書き換えるので、共通設定を既存の内容へマージする。環境固有のキーは残り、同じキーは共通設定が優先される (配列は丸ごと置き換わる)。 */ -}}
{{- $current := dict -}}
{{- if .chezmoi.stdin -}}
{{-   $current = fromToml .chezmoi.stdin -}}
{{- end -}}
{{- $shared := include ".codex-config.toml" | fromToml -}}
{{ mergeOverwrite $current $shared | toToml }}
