# ここには「どこまで自動で上げてよいか」を書く。正確なバージョンとチェックサムは mise.lock で固定する。
# 更新の手順は docs/tools.md。
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "windows-x64"]

[tools]
chezmoi = "2"

go = "1.27"
"go:golang.org/x/tools/cmd/goimports" = "latest"
node = "26"
rust = "1.99"
deno = "2"
bun = "1"
uv = "latest"
python = "3.14"
java = "21"
terraform = "1"

# mise では Windows に入らないので、Windows は winget で入れる
aws-cli = { version = "2", os = ["linux", "macos"] }
# Bitwarden Secrets Manager の CLI。API キーは bws-run で、使うコマンドにだけ渡す (docs/secrets.md)
bitwarden-secrets-manager = "2"
# Windows は Codex のアプリが入れる。Linux は review-loop の codex review に使う (docs/codex.md)
codex = { version = "latest", os = ["linux"] }
gh = "latest"
ghq = "latest"
ripgrep = "latest"
fd = "latest"
shellcheck = "latest"
vale = "3"
yt-dlp = "latest"
# 翻訳用のPLaMo 3 Translateを動かす(plamo-server、docs/tools.md)。GPUはWindows側にあるのでWindowsだけ
# Windows向けのビルドはプレリリースにしかなく、latestでは引けないのでタグで固定する
# CUDA版は本体とcudartが別のzipで、miseでは片方しか入らない。Vulkan版は1つで済み、GTX 1080では生成の速さも変わらない
"github:ggml-org/llama.cpp" = { version = "b12317", os = ["windows"], asset_pattern = "llama-*-bin-win-vulkan-x64.zip" }
