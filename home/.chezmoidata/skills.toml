# エージェントのスキルの出どころ。中身はリポジトリに入れず、chezmoi が固定したコミットの
# アーカイブから取り出す (home/.chezmoiexternals/skills.toml.tmpl)。更新は provision/update-skills.sh。
#
#   repo     GitHub の owner/name
#   path     スキルのディレクトリ。リポジトリの直下なら ""
#   commit   固定するコミット (40 桁)
#   targets  置く先。claude は ~/.claude/skills、codex は ~/.agents/skills
#   exclude  取り出さないファイル (スキルのディレクトリからの相対パス、省略可)。
#            シンボリックリンクは、開発者モードでない Windows では作れないので外す

[skills.deploy-to-vercel]
repo = "vercel-labs/agent-skills"
path = "skills/deploy-to-vercel"
commit = "6ec269328bc400712ee225a173a14b6b29128df7"
targets = ["claude", "codex"]

[skills.find-skills]
repo = "vercel-labs/skills"
path = "skills/find-skills"
commit = "3aa2fea1ad879325233096bfbee3eaa07deb5327"
targets = ["claude"]

[skills.rust-skills]
repo = "leonardomso/rust-skills"
path = ""
commit = "fd2a861ab0406a4ac536a55274d14ea6fd1ca9c9"
targets = ["claude", "codex"]
# どちらも SKILL.md へのシンボリックリンク
exclude = ["AGENTS.md", "CLAUDE.md"]

