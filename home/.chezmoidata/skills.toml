# エージェントのスキルの出どころ。中身はリポジトリに入れず、chezmoiが固定したコミットの
# アーカイブから取り出す(home/.chezmoiexternals/skills.toml.tmpl)。更新はprovision/update-skills.sh。
#
#   repo     GitHubのowner/name
#   path     スキルのディレクトリ。リポジトリの直下なら""
#   commit   固定するコミット(40桁)
#   targets  置く先(省略可)。既定は["claude", "agents"]。
#            claudeは~/.claude/skills(Claude Code)、
#            agentsは~/.agents/skills(Codex、Antigravityは~/.gemini/config/skills.jsonで読む)
#   exclude  取り出さないファイル(スキルのディレクトリからの相対パス、省略可)。
#            シンボリックリンクは、開発者モードでないWindowsでは作れないので外す

