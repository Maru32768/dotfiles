# 検査の内容は tests/ci/ にあり、手元でも同じものを実行できる。docs/ci.md を参照。
name: CI

on:
  push:
    branches: ["**"] # stable タグの付け替えでは動かさない
    # 文書だけの変更では動かさない。home の下の .md (CLAUDE.md、rules、スキル) は render.sh が、docs/gpg.md の
    # フィンガープリントは invariants.sh が確かめるので動かす。後に書いたパターンが勝つ
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "home/**"
      - "docs/gpg.md"
  schedule:
    # 固定していないもの (apt、インストーラー、Vim プラグイン) の破損に気づくため。日曜 6:00 JST
    - cron: "0 21 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks が履歴すべてを調べる
          persist-credentials: false
      - run: bash tests/ci/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }} # mise が GitHub の API を呼ぶときの回数制限を避ける
      - run: bash tests/ci/static.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [main, agent, research, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/ci/container.sh ${{ matrix.profile }}

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # docs/mac.md のセットアップと同じ手順で作り、doctor で確かめる
      - run: brew bundle --file packages/Brewfile
      # 使っている Mac に入れるときの予行。今ある ~/.zshrc を、書き換わるファイルとして出すことを確かめる
      - run: |
          echo '# runner' >>~/.zshrc
          preview="$(DOTFILES_PREVIEW=1 bash provision/user.sh main "$GITHUB_WORKSPACE")"
          printf '%s\n' "$preview"
          grep -qx ' M .zshrc' <<<"$preview"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: bash provision/user.sh main "$GITHUB_WORKSPACE"
        env:
          GITHUB_TOKEN: ${{ github.token }} # mise が GitHub の API を呼ぶときの回数制限を避ける
      - run: bash "$HOME/dotfiles/tests/doctor.sh"
      # mac の /bin/bash (3.2) は、UTF-8 のロケールで変数の直後の日本語を読み違える。セットアップの手順で動かす bash で試す
      - run: LANG=en_US.UTF-8 /bin/bash tests/ci/setup-credentials-test.sh
      # mac でしか効かない検査 (Homebrew の PATH、Apple の ssh) がある
      - run: bash tests/ci/render.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 の構文
        shell: powershell
        run: .\tests\ci\windows.ps1
      - name: op-run のテスト
        shell: pwsh
        run: .\tests\ci\op-run-test.ps1
      - name: lab.ps1 run のテスト
        shell: pwsh
        run: .\tests\ci\lab-run-test.ps1
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          .\tests\ci\windows.ps1 -Analyze
